[tools]
bun             = "latest"
just            = "1.50.0"
python          = "latest"
uv              = "0.11.8"
"pipx:mdformat" = { version = "1.0.0", uvx_args = "--with mdformat-gfm --with mdformat-frontmatter --with mdformat-footnote --with mdformat-simple-breaks --with mdformat-gfm-alerts --with mdformat-toc --with mdformat-wikilink --with mdformat-tables" }
pre-commit      = "4.6.0"
git-cliff       = "2.13.1"
actionlint      = "1.7.12"
docker-compose  = "5.1.3"
oxlint          = "1.62.0"
act             = "0.2.88"
ruff            = "0.15.12"
yamllint        = "1.38.0"
shfmt           = "3.13.1"
ripgrep         = "15.1.0"
vale            = "3.14.1"
docker-cli      = "29.4.2"

# Many of these settings are defaults, but we are explicit in case they change in the future and to make it clear to users what is enabled.
[settings]
activate_aggressive                 = true
idiomatic_version_file_enable_tools = [ "python", "bun" ]
env_cache                           = true
exec_auto_install                   = true
github_attestations                 = true
lockfile                            = true
pin                                 = true
slsa                                = true

[settings.npm]
package_manager = "bun"

[settings.pipx]
uvx = true
